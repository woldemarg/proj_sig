# SIG as three services (docs/12_architecture.md §12.5):
#   sig    the backend: analytical core, HTTP API with the chat endpoint, web UI  -> http://127.0.0.1:${SIG_WEB_PORT:-8765}
#   llm    the LLM gateway (OpenAI-compatible) in front of the upstream model   -> reachable only inside the stack (http://llm:8080)
#   neo4j  the graph mirror (Neo4j Community)                                   -> browser http://127.0.0.1:17474, bolt 127.0.0.1:17687
#
#   docker compose up -d --build        then open http://127.0.0.1:8765
#
# Before the first start: the embedding model in ./models (python scripts/download_model.py) and the gateway's
# settings in ./.env.gemma (template: .env.gemma.sample). SIG_NEO4J_PASSWORD sets the mirror's password on the
# first start (default sig-local-password; at least 8 characters); the Neo4j volume keeps it afterwards.
# Host ports: SIG_WEB_PORT, SIG_NEO4J_HTTP_PORT, SIG_NEO4J_BOLT_PORT (scripts/compose_check.py uses others, so both run side by side).

name: sig

services:
  neo4j:
    image: neo4j:5.26.31-community
    environment:
      NEO4J_AUTH: neo4j/${SIG_NEO4J_PASSWORD:-sig-local-password}
    ports:
      - "127.0.0.1:${SIG_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${SIG_NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${SIG_NEO4J_PASSWORD:-sig-local-password}", "RETURN 1"]
      interval: 30s
      start_interval: 2s
      start_period: 60s
      timeout: 10s
      retries: 5
    stop_grace_period: 30s
    restart: unless-stopped

  llm:
    build:
      context: .
      dockerfile: llm_gateway/Dockerfile
    env_file:
      - path: .env.gemma
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"  # a local upstream (Ollama, LM Studio) on the host, also on Linux engines
    init: true
    restart: unless-stopped

  sig:
    build:
      context: .
      target: runtime
    depends_on:  # both are optional to the backend: the mirror syncs on the next commit, answers fall back without an LLM
      neo4j:
        condition: service_started
      llm:
        condition: service_started
    environment:
      LLM_BASE_URL: http://llm:8080/v1
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${SIG_NEO4J_PASSWORD:-sig-local-password}
      NEO4J_DATABASE: neo4j  # Community Edition serves one user database
    volumes:
      - ./models:/app/models:ro
      - sig-workspace:/data
    ports:
      - "127.0.0.1:${SIG_WEB_PORT:-8765}:8765"
    init: true
    stop_grace_period: 60s  # a running batch gets time to finish; one cut short is rolled back at the next start
    restart: unless-stopped

volumes:
  neo4j-data:
  sig-workspace:

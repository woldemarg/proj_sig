[project]
name = "sig"
version = "0.1.0"
description = "SIG — validated subgroup insights in a dual knowledge graph with latent anchors, served as a microservice suite"
requires-python = ">=3.12"

# Dependencies: one group per owner, each listed once; exact versions in uv.lock (docs/12_architecture.md §12.5).
# Host: `uv sync` (the dev group). Images: `uv sync --frozen --no-default-groups --group <service> [--group cpu|cu130]`.
[dependency-groups]
miner = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "pysubgroup==0.7.7",
    "h3>=4.0",
    "pyarrow>=15",  # .parquet uploads
]
topology = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "sentence-transformers>=5.0",  # SentenceTransformer.get_embedding_dimension
    "transformers>=4.56",  # Qwen3, model_kwargs={"dtype": ...}
]
query = ["numpy>=1.26", "scikit-learn>=1.3"]
graph = [
    { include-group = "miner" },
    { include-group = "topology" },
    { include-group = "query" },
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "neo4j>=5.0",
    "huggingface_hub>=0.23",  # model provisioning (core/model_store.py)
]
narrator = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
broker = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# the torch build of the graph image (build arg TORCH); the host takes PyPI's torch through sentence-transformers
cpu = ["torch"]
cu130 = ["torch"]
# pinned tools: a new linter or test-runner release must not change the gate's verdict on unchanged code
dev = [
    { include-group = "graph" },
    { include-group = "narrator" },
    { include-group = "broker" },
    "pytest==9.1.1",
    "ruff==0.16.9",
    "playwright==1.63.0",  # optional: the browser smoke test (uses an installed Chromium)
    "rdflib==7.6.0",  # the GeoSPARQL export test (tests/test_spatial.py)
    "pyshacl==0.40.1",  # its SHACL validation against tests/vendor/geosparql_validator.ttl
]

[tool.uv]
package = false
default-groups = ["dev"]
conflicts = [[{ group = "cpu" }, { group = "cu130" }]]
# pysubgroup declares matplotlib for its plots, which SIG never draws
override-dependencies = ["matplotlib; sys_platform == 'never'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Lint + format gate (AGENTS.md Rule 0: `python scripts/check.py`).
[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["*.md", "sig_web_console/static", "models", "workspace", "data", ".pytest_tmp", ".scratch"]  # Markdown stays as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are allowed where a formula or a table row reads better unbroken
    "B023",  # the traversal's step() closes over its loop variables on purpose (called inside the loop)
    "B905",  # zip(strict=...) everywhere is noise; lengths are guaranteed by construction at the call sites
    "UP042", # EdgeType(str, Enum) is the stored-JSON contract; StrEnum would change nothing but the diff
]

[tool.ruff.lint.per-file-ignores]
"subgroup_miner/vendor/eda/main_upd.py" = ["I", "UP", "B", "E"]  # vendored EDA: keep the upstream style (PROVENANCE.md)
"insight_graph_service/server/app.py" = ["B008"]  # FastAPI's `File(...)` / `Form(...)` defaults are the framework's declaration idiom

[tool.ruff.format]
exclude = ["subgroup_miner/vendor/eda/main_upd.py"]  # same reason: cosmetic drift from upstream is noise

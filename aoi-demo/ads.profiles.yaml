# ADS for the demo: the orchestrator and what it needs to run a job (minio, postgres, executor, llm), with MLflow for its
# traces as ADS has it (http://localhost:5050, workspace and experiment agentic-data-science). Extra ADS services
# (UI, auth, Phoenix, monitoring) start only with `--profile ads-full`.
services:
  phoenix: { profiles: [ads-full] }
  ads-a2a: { profiles: [ads-full] }
  delta-ai-copilot: { profiles: [ads-full] }
  local-auth: { profiles: [ads-full] }
  extension-spectr: { profiles: [ads-full] }
  prometheus: { profiles: [ads-full] }
  grafana: { profiles: [ads-full] }
  orchestrator:
    environment: { TRACING_BACKEND: mlflow }  # ADS sets "phoenix,mlflow"; Phoenix is not started here
    depends_on: !override  # ADS's own list without phoenix, and after mlflow-init: the orchestrator sets MLflow tracing up
      minio: { condition: service_healthy }  # once at start, in a workspace mlflow-init creates
      postgres: { condition: service_healthy }
      executor: { condition: service_started }
      llm: { condition: service_started }
      mlflow-init: { condition: service_completed_successfully }

volumes:
  # MLflow on the standalone ADS stack's volume: the traces of both stacks in one place; created here if missing, so
  # `docker compose down -v` here removes it too. The standalone ADS stack is stopped while the demo runs.
  mlflow_data:
    name: agentic-data-science_mlflow_data

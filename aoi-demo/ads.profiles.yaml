# ADS for the demo: the orchestrator and what it needs to run a job (minio, postgres, executor, llm), with Phoenix for its
# traces (http://127.0.0.1:6006). Copilot, its UI and auth, MLflow and monitoring start only with `--profile ads-full`.
services:
  mlflow: { profiles: [ads-full] }
  mlflow-init: { profiles: [ads-full] }
  ads-a2a: { profiles: [ads-full] }
  delta-ai-copilot: { profiles: [ads-full] }
  local-auth: { profiles: [ads-full] }
  extension-spectr: { profiles: [ads-full] }
  prometheus: { profiles: [ads-full] }
  grafana: { profiles: [ads-full] }
  orchestrator:
    environment: { TRACING_BACKEND: phoenix }  # ADS sets "phoenix,mlflow"; MLflow is not started here, so Phoenix alone

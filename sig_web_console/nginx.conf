# The web console's edge (docs/12_architecture.md): the static UI and one origin for both services. Paths are
# forwarded unchanged (proxy_pass without a URI part); the longest prefix wins. scripts/dev.py routes the same way.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;  # Docker's DNS, asked again: a re-created service is found without a restart
    set $narrator http://evidence-narrator:8000;  # a variable makes nginx resolve per request
    set $graph http://insight-graph:8000;
    gzip on;  # JSON, GeoJSON and Turtle shrink 10-20x: a fine level's cells.geojson is tens of MB raw
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/geo+json text/turtle text/css application/javascript;  # text/html always
    proxy_set_header Host $host;  # inherited by both proxied locations (neither sets a header of its own)
    proxy_set_header X-Real-IP $remote_addr;

    location /api/chat/ {  # the narrator: verbalised answers
        proxy_pass $narrator;
        proxy_read_timeout 780s;  # the graph's evidence (INSIGHT_GRAPH_TIMEOUT_S 600), then the LLM's answer (LLM_TIMEOUT_S 120)
    }

    location /api/ {  # the graph service: uploads, batches, graph, sphere, evidence
        proxy_pass $graph;
        client_max_body_size 200m;  # MAX_UPLOAD_MB; the service checks it too
        proxy_request_buffering off;  # uploads stream through, no spool here
        proxy_read_timeout 600s;  # as long as the narrator waits for the same evidence
    }

    location / {
        add_header Cache-Control "no-cache" always;  # revalidate (ETag): a rebuilt console is picked up on the next load
        try_files $uri /index.html;
    }
}

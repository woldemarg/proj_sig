[pytest]
testpaths = tests
pythonpath = . tests scripts
addopts = -q --basetemp=.pytest_tmp -p no:cacheprovider
markers =
    model: needs the bundled Qwen3 embedding model in MODEL_DIR/Qwen3-Embedding-0.6B, default models/ (skipped when absent)
    browser: drives the UI in a local Chromium via Playwright (skipped when absent)
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated

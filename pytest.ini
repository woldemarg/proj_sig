[pytest]
testpaths = tests
pythonpath = . tests
addopts = -q --basetemp=.pytest_tmp -p no:cacheprovider
markers =
    model: needs the local sentence-transformers model cache (skipped when absent)
    browser: drives the UI in a local Chromium via Playwright (skipped when absent)
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
